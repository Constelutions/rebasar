name: Build installers

# Builds every installer without publishing anything; the release workflow calls this one too.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The oldest Ubuntu runner keeps the glibc baseline of the Linux builds low.
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev wget

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the installers
        run: pnpm bundle
        env:
          # The runner has no FUSE, which linuxdeploy would otherwise need to run itself.
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb

  checksums:
    name: Name and checksum the assets
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: assets
          merge-multiple: true

      # upload-artifact keeps the folder each installer was built in (nsis/, appimage/, deb/), but
      # the release assets are a flat list of files.
      - name: Flatten the assets
        shell: bash
        working-directory: assets
        run: |
          find . -mindepth 2 -type f -name 'Rebasar_*' -exec mv -t . {} +
          find . -mindepth 1 -type d -empty -delete
          ls -l

      - name: Write SHA256SUMS
        shell: bash
        working-directory: assets
        run: |
          sha256sum Rebasar_* > SHA256SUMS
          cat SHA256SUMS

      - name: Check the asset names and checksums against the contract
        shell: bash
        run: |
          version=$(node scripts/release/plan.mjs version)
          node scripts/release/plan.mjs check-assets --version "$version" --dir assets

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          if-no-files-found: error
          path: assets/*
