[package]
name = "rebasar-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dunce = "1.0.5"
gix = { version = "0.89.0", default-features = false, features = ["max-performance-safe", "sha1", "status", "revision"] }
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
ureq = { version = "3.4.2", default-features = false, features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
keyring-core = "1.0.0"
windows-native-keyring-store = { version = "1.1.0", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }

[dev-dependencies]
rebasar-testkit = { path = "../rebasar-testkit" }
tempfile = "3.27.0"
