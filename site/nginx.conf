# nginx for the Rebasar site on Coolify. Same hardening as the Constelutions blog.

load_module modules/ngx_http_headers_more_filter_module.so;
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

user nginx;
worker_processes auto;
pid /run/nginx.pid;

# Docker only captures stdout and stderr, not log files.
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # The static modules serve the Dockerfile's precompressed .br and .gz files; the dynamic
    # filters stay on for anything that was not precompressed. Both JavaScript media types are
    # listed because nginx's mime.types switched from application/javascript to text/javascript
    # in 1.25.1, and the *_types lists match on the resolved Content-Type.
    brotli_static on;
    brotli on;
    brotli_comp_level 5;
    brotli_min_length 256;
    brotli_types
        text/plain text/css text/javascript text/xml
        application/javascript application/json application/manifest+json
        application/xml image/svg+xml;

    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    # Coolify's proxy adds a Via header, and nginx declines to compress such requests by default.
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript text/xml
        application/javascript application/json application/manifest+json
        application/xml image/svg+xml;

    server_tokens off;
    more_clear_headers Server;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Coolify terminates TLS, so nginx's own scheme and port are not the client's. Relative
        # redirects resolve against the URL the browser requested.
        absolute_redirect off;

        # add_header does not merge across levels: a location that adds a header drops every
        # inherited one, so the security headers are repeated in each location below.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            add_header Cache-Control "no-store";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            return 200 "ok\n";
        }

        # Astro fingerprints everything under /_astro/, so it can be cached forever.
        location /_astro/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }

        # The HTML must revalidate, so a new release shows up as soon as the site is rebuilt.
        location / {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            try_files $uri $uri/ $uri.html =404;
        }
    }
}
